<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e7f3ff"/><stop offset="1" stop-color="#f7fbff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0b3978" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#0b63ce"/></marker>
    <marker id="arrowred" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#d64b4b"/></marker>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#082f67}.subtitle{font:400 19px Arial,sans-serif;fill:#526b89}
      .box{fill:#fff;stroke:#0b63ce;stroke-width:2.4;rx:18;filter:url(#shadow)}.h{font:700 21px Arial,sans-serif;fill:#082f67}.t{font:400 16px Arial,sans-serif;fill:#27496f}.small{font:400 14px Arial,sans-serif;fill:#526b89}
      .line{fill:none;stroke:#0b63ce;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#d64b4b;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#arrowred)}
      .pill{fill:#e8f4ff;stroke:#86bdf3;stroke-width:1.5}.pilltext{font:600 14px Arial,sans-serif;fill:#0b3978}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fbfdff"/>
  <text x="800" y="68" text-anchor="middle" class="title">CI/CD Deployment Architecture</text>
  <text x="800" y="101" text-anchor="middle" class="subtitle">Immutable delivery through GitHub Actions, GHCR, AWS OIDC and Systems Manager</text>

  <g transform="translate(35 235)"><rect width="180" height="190" class="box"/><text x="90" y="55" text-anchor="middle" class="h">Developer</text><circle cx="90" cy="95" r="25" fill="#d8ebff" stroke="#0b63ce" stroke-width="2"/><text x="90" y="145" text-anchor="middle" class="t">Push / merge</text><text x="90" y="170" text-anchor="middle" class="t">to main</text></g>
  <path d="M215 330H262" class="line"/>
  <g transform="translate(265 235)"><rect width="180" height="190" class="box"/><text x="90" y="55" text-anchor="middle" class="h">GitHub</text><text x="90" y="88" text-anchor="middle" class="h">repository</text><circle cx="90" cy="125" r="21" fill="#082f67"/><text x="90" y="165" text-anchor="middle" class="small">main branch</text></g>
  <path d="M445 330H492" class="line"/>
  <g transform="translate(495 185)"><rect width="245" height="290" class="box"/><rect width="245" height="65" rx="18" fill="url(#head)"/><text x="122" y="41" text-anchor="middle" class="h">GitHub Actions CI</text><rect x="25" y="87" width="195" height="42" rx="12" class="pill"/><text x="122" y="113" text-anchor="middle" class="pilltext">npm ci + migrations</text><rect x="25" y="143" width="195" height="42" rx="12" class="pill"/><text x="122" y="169" text-anchor="middle" class="pilltext">PostgreSQL integration tests</text><rect x="25" y="199" width="195" height="42" rx="12" class="pill"/><text x="122" y="225" text-anchor="middle" class="pilltext">Backend + frontend build</text><text x="122" y="270" text-anchor="middle" class="small">Publish only after success</text></g>
  <path d="M740 330H787" class="line"/>
  <g transform="translate(790 235)"><rect width="190" height="190" class="box"/><text x="95" y="55" text-anchor="middle" class="h">GHCR</text><path d="M62 84l33-19 33 19v38l-33 19-33-19z" fill="#d8ebff" stroke="#0b63ce" stroke-width="3"/><text x="95" y="163" text-anchor="middle" class="small">sha-&lt;commit&gt;</text><text x="95" y="181" text-anchor="middle" class="small">immutable image</text></g>

  <path d="M980 330H1027" class="line"/>
  <g transform="translate(1030 175)"><rect width="220" height="310" class="box"/><rect width="220" height="65" rx="18" fill="url(#head)"/><text x="110" y="41" text-anchor="middle" class="h">Secure AWS access</text><text x="110" y="108" text-anchor="middle" class="h">GitHub OIDC</text><text x="110" y="139" text-anchor="middle" class="t">short-lived token</text><path d="M110 160v35" class="line"/><text x="110" y="227" text-anchor="middle" class="h">Restricted IAM role</text><text x="110" y="258" text-anchor="middle" class="small">SSM to one instance</text><text x="110" y="282" text-anchor="middle" class="small">No SSH · no AWS keys</text></g>
  <path d="M1250 330H1297" class="line"/>
  <g transform="translate(1300 235)"><rect width="260" height="190" class="box"/><text x="130" y="55" text-anchor="middle" class="h">AWS Systems Manager</text><text x="130" y="89" text-anchor="middle" class="t">Run Command</text><text x="130" y="124" text-anchor="middle" class="small">Pull exact image</text><text x="130" y="150" text-anchor="middle" class="small">Recreate API only</text><text x="130" y="176" text-anchor="middle" class="small">Stream status to workflow</text></g>

  <path d="M1430 425V535H1260" class="line"/>
  <rect x="640" y="540" width="820" height="245" rx="25" fill="#f4f9ff" stroke="#0b63ce" stroke-width="3"/>
  <text x="680" y="584" class="h">AWS EC2 · Docker Compose</text>
  <g transform="translate(690 620)"><rect width="205" height="115" class="box"/><text x="102" y="44" text-anchor="middle" class="h">Caddy</text><text x="102" y="75" text-anchor="middle" class="t">HTTPS edge</text><text x="102" y="98" text-anchor="middle" class="small">preserved</text></g>
  <g transform="translate(930 620)"><rect width="240" height="115" class="box"/><text x="120" y="44" text-anchor="middle" class="h">Quota Service API</text><text x="120" y="75" text-anchor="middle" class="t">new SHA image</text><text x="120" y="98" text-anchor="middle" class="small">health-gated replacement</text></g>
  <g transform="translate(1205 620)"><rect width="205" height="115" class="box"/><text x="102" y="44" text-anchor="middle" class="h">PostgreSQL 16</text><text x="102" y="75" text-anchor="middle" class="t">volume + secrets</text><text x="102" y="98" text-anchor="middle" class="small">preserved</text></g>
  <path d="M980 425V520H1050V620" class="line"/>
  <rect x="1010" y="795" width="310" height="45" rx="20" class="pill"/><text x="1165" y="823" text-anchor="middle" class="pilltext">Docker health + HTTP /health verification</text>
  <path d="M1050 735V818H995V735" class="dash"/>
  <text x="840" y="824" text-anchor="middle" class="small" fill="#a23838">Failure → restore previous image</text>
  <text x="800" y="872" text-anchor="middle" class="small">Production deployment is serialized; mutable latest tags are never deployed.</text>
</svg>
