services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quota_db}
      POSTGRES_USER: ${POSTGRES_USER:-quota_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quota_password}
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-usage-metering-and-quota-service:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quota_user}:${POSTGRES_PASSWORD:-quota_password}@postgres:5432/${POSTGRES_DB:-quota_db}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      PORT: 3000
      ACCOUNT_CREATION_RATE_LIMIT_MAX: ${ACCOUNT_CREATION_RATE_LIMIT_MAX:-3}
      ACCOUNT_CREATION_RATE_LIMIT_WINDOW_MS: ${ACCOUNT_CREATION_RATE_LIMIT_WINDOW_MS:-900000}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  postgres_data:
