services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: quota_db
      POSTGRES_USER: quota_user
      POSTGRES_PASSWORD: quota_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quota_user -d quota_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
