<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9edff"/><stop offset="1" stop-color="#f2f8ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0b3978" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0b63ce"/></marker>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#082f67}.subtitle{font:400 18px Arial,sans-serif;fill:#526b89}
      .table{fill:#fff;stroke:#0b63ce;stroke-width:2.3;rx:16;filter:url(#shadow)}.th{fill:url(#head)}
      .h{font:700 22px Arial,sans-serif;fill:#082f67}.f{font:400 15px Consolas,monospace;fill:#27496f}.key{font:700 13px Arial,sans-serif;fill:#0b63ce}
      .rel{fill:none;stroke:#0b63ce;stroke-width:2.3;marker-end:url(#arrow)}.label{font:600 13px Arial,sans-serif;fill:#0b3978}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="#fbfdff"/>
  <text x="900" y="63" text-anchor="middle" class="title">Quota Service Database</text>
  <text x="900" y="96" text-anchor="middle" class="subtitle">Simplified PostgreSQL ERD · derived from src/db/schema.ts</text>

  <g transform="translate(60 165)"><rect width="380" height="205" class="table"/><rect width="380" height="52" rx="16" class="th"/><text x="24" y="34" class="h">accounts</text><text x="24" y="82" class="key">PK</text><text x="70" y="82" class="f">id : uuid</text><text x="24" y="112" class="f">name : text</text><text x="24" y="142" class="key">FK</text><text x="70" y="142" class="f">current_plan_id → plans.id</text><text x="24" y="172" class="f">created_at · updated_at</text></g>
  <g transform="translate(710 135)"><rect width="430" height="265" class="table"/><rect width="430" height="52" rx="16" class="th"/><text x="24" y="34" class="h">plans</text><text x="24" y="82" class="key">PK</text><text x="70" y="82" class="f">id : uuid</text><text x="24" y="112" class="key">FK</text><text x="70" y="112" class="f">owner_account_id → accounts.id?</text><text x="24" y="142" class="f">name · scope (ACCOUNT | USER)</text><text x="24" y="172" class="f">monthly_allowance : bigint</text><text x="24" y="202" class="f">max_units_per_request : bigint</text><text x="24" y="232" class="f">is_predefined · timestamps</text></g>
  <g transform="translate(1340 165)"><rect width="390" height="205" class="table"/><rect width="390" height="52" rx="16" class="th"/><text x="24" y="34" class="h">api_keys</text><text x="24" y="82" class="key">PK</text><text x="70" y="82" class="f">id : uuid</text><text x="24" y="112" class="key">FK</text><text x="70" y="112" class="f">account_id → accounts.id</text><text x="24" y="142" class="f">key_prefix · key_hash (unique)</text><text x="24" y="172" class="f">created_at · last_used_at · revoked_at</text></g>

  <g transform="translate(60 485)"><rect width="420" height="220" class="table"/><rect width="420" height="52" rx="16" class="th"/><text x="24" y="34" class="h">users</text><text x="24" y="82" class="key">PK</text><text x="70" y="82" class="f">id : uuid</text><text x="24" y="112" class="key">FK</text><text x="70" y="112" class="f">account_id → accounts.id</text><text x="24" y="142" class="f">external_user_id</text><text x="24" y="172" class="key">FK</text><text x="70" y="172" class="f">current_plan_id → plans.id</text><text x="24" y="202" class="f">unique(account_id, external_user_id)</text></g>
  <g transform="translate(690 500)"><rect width="430" height="190" class="table"/><rect width="430" height="52" rx="16" class="th"/><text x="24" y="34" class="h">account_monthly_usage</text><text x="24" y="82" class="key">PK/FK</text><text x="90" y="82" class="f">account_id → accounts.id</text><text x="24" y="112" class="key">PK</text><text x="70" y="112" class="f">month_start : date</text><text x="24" y="142" class="f">used_units : bigint</text><text x="24" y="172" class="f">updated_at</text></g>
  <g transform="translate(1310 500)"><rect width="420" height="190" class="table"/><rect width="420" height="52" rx="16" class="th"/><text x="24" y="34" class="h">user_monthly_usage</text><text x="24" y="82" class="key">PK/FK</text><text x="90" y="82" class="f">user_id → users.id</text><text x="24" y="112" class="key">PK</text><text x="70" y="112" class="f">month_start : date</text><text x="24" y="142" class="f">used_units : bigint</text><text x="24" y="172" class="f">updated_at</text></g>

  <g transform="translate(500 805)"><rect width="800" height="230" class="table"/><rect width="800" height="52" rx="16" class="th"/><text x="24" y="34" class="h">usage_requests</text><text x="24" y="82" class="key">PK</text><text x="70" y="82" class="f">id : uuid</text><text x="24" y="112" class="key">FK</text><text x="70" y="112" class="f">account_id → accounts.id · user_id → users.id</text><text x="24" y="142" class="key">FK</text><text x="70" y="142" class="f">account_plan_id → plans.id · user_plan_id → plans.id</text><text x="24" y="172" class="f">request_id · units · status · rejection_scope/rule · month_start</text><text x="24" y="202" class="f">plan-limit + used/remaining decision snapshots · created_at</text><text x="475" y="82" class="f">unique(account_id, request_id)</text></g>

  <path d="M440 230H705" class="rel"/><text x="555" y="218" class="label">current plan</text>
  <path d="M710 305H610V335H445" class="rel"/><text x="545" y="325" class="label">custom owner 0..N</text>
  <path d="M440 190V122H1535V160" class="rel"/><text x="1190" y="112" class="label">1 account → N keys</text>
  <path d="M250 370V480" class="rel"/><text x="265" y="430" class="label">1 → N users</text>
  <path d="M820 400V445H520V560H485" class="rel"/><text x="535" y="548" class="label">user plan</text>
  <path d="M440 330H620V565H685" class="rel"/><text x="470" y="402" class="label">account month counter</text>
  <path d="M480 520H600V445H1250V575H1305" class="rel"/><text x="1010" y="435" class="label">1 user → N month rows</text>
  <path d="M270 705V760H650V800" class="rel"/><text x="335" y="747" class="label">tenant + user</text>
  <path d="M905 690V800" class="rel"/><text x="920" y="755" class="label">account snapshot context</text>
  <path d="M1140 360H1240V760H1150V800" class="rel"/><text x="1140" y="748" class="label">plan snapshots</text>

  <text x="55" y="1070" class="subtitle">Relationships shown are the important ownership, current-plan, counter, and immutable decision-history links. Nullable owner_account_id distinguishes global predefined plans from tenant-owned custom plans.</text>
</svg>
