<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8f4ff"/><stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b3978" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#0b63ce"/></marker>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#082f67}.subtitle{font:400 19px Arial,sans-serif;fill:#526b89}
      .box{fill:#fff;stroke:#0b63ce;stroke-width:2.5;rx:18;filter:url(#shadow)}.head{fill:url(#header)}
      .h{font:700 24px Arial,sans-serif;fill:#082f67}.t{font:400 17px Arial,sans-serif;fill:#27496f}.small{font:400 14px Arial,sans-serif;fill:#526b89}
      .pill{fill:#e8f4ff;stroke:#86bdf3;stroke-width:1.5}.pilltext{font:600 14px Arial,sans-serif;fill:#0b3978}
      .line{fill:none;stroke:#0b63ce;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fbfdff"/>
  <text x="800" y="70" text-anchor="middle" class="title">Usage Metering &amp; Quota Service</text>
  <text x="800" y="103" text-anchor="middle" class="subtitle">Production system architecture · AWS EC2 · Docker Compose</text>

  <g transform="translate(45 280)">
    <rect width="225" height="290" class="box"/>
    <rect width="225" height="62" class="head" rx="18"/>
    <text x="112" y="39" text-anchor="middle" class="h">Clients</text>
    <circle cx="112" cy="112" r="28" fill="#d8ebff" stroke="#0b63ce" stroke-width="2"/>
    <circle cx="112" cy="102" r="9" fill="#0b63ce"/><path d="M91 128q21-28 42 0" fill="#0b63ce"/>
    <text x="112" y="167" text-anchor="middle" class="t">React dashboard</text>
    <text x="112" y="196" text-anchor="middle" class="t">API clients</text>
    <text x="112" y="225" text-anchor="middle" class="small">Postman · curl · SDKs</text>
    <rect x="34" y="248" width="157" height="29" rx="14" class="pill"/><text x="112" y="268" text-anchor="middle" class="pilltext">HTTPS only</text>
  </g>

  <path d="M270 425H347" class="line"/>
  <g transform="translate(350 325)">
    <rect width="225" height="200" class="box"/>
    <rect width="225" height="62" class="head" rx="18"/>
    <text x="112" y="39" text-anchor="middle" class="h">Public edge</text>
    <text x="112" y="103" text-anchor="middle" class="t">DuckDNS domain</text>
    <text x="112" y="135" text-anchor="middle" class="t">Caddy reverse proxy</text>
    <text x="112" y="166" text-anchor="middle" class="small">TLS termination · Let's Encrypt</text>
  </g>

  <path d="M575 425H655" class="line"/>
  <rect x="320" y="155" width="1220" height="650" rx="28" fill="none" stroke="#0b63ce" stroke-width="3" stroke-dasharray="9 7"/>
  <rect x="320" y="155" width="1220" height="70" rx="28" fill="url(#header)"/>
  <text x="360" y="199" class="h">AWS EC2 · Amazon Linux 2023</text>
  <text x="1495" y="198" text-anchor="end" class="small">Single-host portfolio deployment</text>

  <g transform="translate(710 275)">
    <rect width="500" height="310" class="box"/>
    <rect width="500" height="66" class="head" rx="18"/>
    <text x="250" y="42" text-anchor="middle" class="h">Fastify application container</text>
    <rect x="30" y="95" width="205" height="170" rx="14" class="pill"/>
    <text x="132" y="130" text-anchor="middle" class="h">React UI</text>
    <text x="132" y="162" text-anchor="middle" class="t">Production bundle</text>
    <text x="132" y="193" text-anchor="middle" class="t">served by Fastify</text>
    <text x="132" y="226" text-anchor="middle" class="small">SPA + static assets</text>
    <rect x="265" y="95" width="205" height="170" rx="14" class="pill"/>
    <text x="367" y="130" text-anchor="middle" class="h">REST API</text>
    <text x="367" y="162" text-anchor="middle" class="t">Node.js · TypeScript</text>
    <text x="367" y="193" text-anchor="middle" class="t">API-key authentication</text>
    <text x="367" y="224" text-anchor="middle" class="t">Quota + rate limiting</text>
  </g>

  <path d="M1210 430H1280" class="line"/>
  <g transform="translate(1285 295)">
    <rect width="205" height="270" class="box"/>
    <rect width="205" height="66" class="head" rx="18"/>
    <text x="102" y="42" text-anchor="middle" class="h">PostgreSQL 16</text>
    <ellipse cx="102" cy="117" rx="48" ry="20" fill="#0b63ce"/><path d="M54 117v74c0 11 22 20 48 20s48-9 48-20v-74" fill="#d8ebff" stroke="#0b63ce" stroke-width="2"/>
    <path d="M54 147c0 11 22 20 48 20s48-9 48-20M54 176c0 11 22 20 48 20s48-9 48-20" fill="none" stroke="#0b63ce" stroke-width="2"/>
    <text x="102" y="237" text-anchor="middle" class="small">Transactions · row locks</text>
    <text x="102" y="258" text-anchor="middle" class="small">Persistent named volume</text>
  </g>

  <g transform="translate(710 630)">
    <rect width="780" height="115" rx="18" fill="#fff" stroke="#86bdf3" stroke-width="2"/>
    <text x="30" y="37" class="h">Docker Compose runtime</text>
    <rect x="30" y="57" width="220" height="37" rx="18" class="pill"/><text x="140" y="81" text-anchor="middle" class="pilltext">API → 127.0.0.1:3000</text>
    <rect x="275" y="57" width="220" height="37" rx="18" class="pill"/><text x="385" y="81" text-anchor="middle" class="pilltext">PostgreSQL internal only</text>
    <rect x="520" y="57" width="230" height="37" rx="18" class="pill"/><text x="635" y="81" text-anchor="middle" class="pilltext">Health checks + log rotation</text>
  </g>

  <rect x="830" y="245" width="210" height="34" rx="17" class="pill"/><text x="935" y="268" text-anchor="middle" class="pilltext">GET /health · GET /docs</text>
  <text x="800" y="855" text-anchor="middle" class="small">Caddy is configured on the live host; the repository's base Compose file remains minimal for local development.</text>
</svg>
